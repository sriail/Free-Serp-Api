# free-serp-api — Cloudflare Worker configuration
# Deploy:  npx wrangler deploy
# Secret: npx wrangler secret put KEY-1   (only needed when REQUIRE_KEY = "true")

name = "free-serp-api"
main = "worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
REQUIRE_KEY = "false"
RATE_LIMITING = "0"

[env.locked]
name = "free-serp-api-locked"
workers_dev = true

[env.locked.vars]
REQUIRE_KEY = "true"
RATE_LIMITING = "60"

# Secrets for the locked env:
#   npx wrangler secret put KEY-1 --env locked

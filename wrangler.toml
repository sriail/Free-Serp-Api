name = "free-search-api"
main = "worker.js"
compatibility_date = "2025-10-01"
workers_dev = true

[vars]
# --- Engine upstream templates (swap engines here; {query} placeholder) ---
UPSTREAM_WEB = "https://www.bing.com/search?q={query}"
UPSTREAM_IMAGES = "https://www.bing.com/images/search?q={query}"
UPSTREAM_VIDEOS = "https://www.bing.com/videos/search?q={query}"

# --- Host allowlists (comma-separated; SSRF guard for continuation tokens) ---
UPSTREAM_WEB_HOSTS = "www.bing.com,cn.bing.com"
UPSTREAM_IMAGES_HOSTS = "www.bing.com,cn.bing.com"
UPSTREAM_VIDEOS_HOSTS = "www.bing.com,cn.bing.com"

# --- Behaviour knobs (all optional; worker.js has the same defaults) ---
CACHE_TTL_SECONDS = "60"        # caches.default TTL for fresh result pages
CORS_ALLOW_ORIGIN = "*"         # or lock down to "https://example.com"
RATE_LIMIT_RPM = "120"          # APPROXIMATE per-isolate limiter (no KV)
# UPSTREAM_TIMEOUT_MS = "12000"
# MAX_CHAIN_PAGES = "100"
# RATE_LIMIT_ENABLED = "true"
# CACHE_ENABLED = "true"
# API_KEY = "change-me"         # prefer `wrangler secret put API_KEY`
